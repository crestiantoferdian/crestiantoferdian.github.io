<script>
  // Tema sama dengan LLK V1 (Caffe Latte / Happy Time / Dark Mode) — dipasang sebelum digambar.
  (function(){try{
    var t=localStorage.getItem('llk_theme');
    if(t==='happy'||t==='dark'){
      document.documentElement.setAttribute('data-theme',t);
      if(t==='happy') document.write('<link id="llkHappyFont" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&display=swap"/>');
    }
  }catch(e){}})();
</script>

<!-- Tampilan V1 apa adanya (salinan otomatis, lihat tools/sync-v1-to-v2.py) -->
<link rel="stylesheet" href="v1.css"/>
<style>
/* Tambahan kecil khusus Guru Mitra (di luar CSS V1) */
.llk-lock{display:flex;align-items:center;gap:6px;font-size:0.8rem;color:var(--muted);font-weight:600;padding:8px 10px;background:var(--paper-2);border-radius:var(--r-sm)}
.llk-lock .ico{width:15px;height:15px}
.mg-boot{min-height:60vh;display:flex;align-items:center;justify-content:center;color:var(--muted);font-weight:600}
.mg-sheet-row{display:flex;gap:8px;align-items:center}
.mg-sheet-row input{flex:1;min-width:0}
/* Materi, PR Guru, Kurikulum & Catatan ke Admin (V2) */
.last-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);padding:14px 16px;margin:0 0 14px}
.kur-bar{height:6px;border-radius:3px;background:var(--paper-2);overflow:hidden;margin:4px 0 6px}
.kur-bar span{display:block;height:100%;background:var(--hadir-solid)}
.kur-item{display:flex;align-items:center;gap:12px;width:100%;min-height:44px;padding:8px 2px;border:none;border-bottom:1px solid var(--border2);background:none;font-family:inherit;font-size:0.92rem;color:var(--text);cursor:pointer}
.nt-kinds{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.nt-kind input{position:absolute;opacity:0;pointer-events:none}
.nt-kind span{display:flex;align-items:center;gap:6px;min-height:44px;padding:8px 10px;border:1.5px solid var(--border);border-radius:var(--r-md);font-size:0.84rem;font-weight:600;cursor:pointer;background:var(--card)}
.nt-kind input:checked+span{border-color:var(--red);background:var(--accent-soft);color:var(--red-text)}
.bottom-nav .bnav{min-width:0}
</style>
</head>

<!-- CATAT KEHADIRAN (sama dengan V1; Guru Mitra: Hadir/Alpa saja, tanpa foto) -->
<div class="overlay" id="noteOverlay">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title" id="noteTitle">Catat Kehadiran</div>
    <div class="modal-sub" id="noteSub"></div>
    <div id="noteMsg"></div>
    <div class="mfield">
      <label>Status</label>
      <select id="noteStatus">
        <option value="hadir">Hadir</option>
        <option value="alpa">Alpa</option>
      </select>
    </div>
    <div class="mfield" id="noteReasonWrap">
      <label>Alasan / Keterangan</label>
      <textarea id="noteReason" rows="3" placeholder="Tidak datang tanpa kabar, dll..."></textarea>
    </div>
    <div class="mfield" id="noteProgressWrap">
      <label><svg class="ico" aria-hidden="true"><use href="#i-note"/></svg> Catatan Progress / Materi Hari Ini <span style="font-weight:500;color:var(--alpa)">(wajib)</span></label>
      <textarea id="noteProgress" rows="4" placeholder="cth: Sudah sampai halaman 12, latihan tangga nada C mayor..."></textarea>
    </div>
    <div class="mfield" id="notePrSiswaWrap">
      <label><svg class="ico" aria-hidden="true"><use href="#i-book"/></svg> PR Siswa <span style="font-weight:500;color:var(--muted)">(opsional)</span></label>
      <textarea id="notePrSiswa" rows="2" placeholder="cth: Latihan bar 5-8, hafalkan tangga nada C mayor untuk minggu depan"></textarea>
      <div class="llk-hint">Tugas latihan buat siswa ini di rumah — tampil di riwayat siswa</div>
    </div>
    <div class="mfield" id="notePrGuruWrap">
      <label><svg class="ico" aria-hidden="true"><use href="#i-tasks"/></svg> PR Guru <span style="font-weight:500;color:var(--muted)">(opsional)</span></label>
      <textarea id="notePrGuru" rows="2" placeholder="cth: Siapkan lembar latihan bar 5-8 untuk sesi depan"></textarea>
      <div class="llk-hint">Pengingat untuk diri sendiri sebelum sesi berikutnya</div>
    </div>
    <div class="mactions">
      <button class="mbtn mbtn-del" id="noteDelBtn" style="display:none">Hapus</button>
      <button class="mbtn mbtn-cancel" id="noteCancelBtn">Batal</button>
      <button class="mbtn mbtn-save" id="noteSaveBtn"><svg class="ico" aria-hidden="true"><use href="#i-check"/></svg> Simpan</button>
    </div>
  </div>
</div>

<!-- KONFIRMASI (gaya dialog V1) -->
<div class="overlay" id="confirmOverlay">
  <div class="modal" style="max-width:360px;text-align:center">
    <div class="llk-dialog-ic danger" id="cfIc"><svg class="ico" aria-hidden="true"><use href="#i-alert"/></svg></div>
    <div class="modal-title" id="cfTitle" style="justify-content:center;margin-bottom:8px"></div>
    <div id="cfMsg" style="font-size:0.92rem;color:var(--text2);text-align:center;margin-bottom:16px;line-height:1.6"></div>
    <div class="mfield" id="cfWordWrap" style="display:none;text-align:left"><label id="cfWordLabel"></label><input id="cfWord" autocomplete="off"/></div>
    <div style="display:flex;gap:10px">
      <button class="mbtn mbtn-cancel" id="cfNo">Batal</button>
      <button class="mbtn" id="cfYes" style="background:var(--alpa);color:#fff"></button>
    </div>
  </div>
</div>

<div id="toast"></div>
