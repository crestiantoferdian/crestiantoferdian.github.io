<!DOCTYPE html>
<html>
<head>
<meta name=viewport content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<script type="text/javascript" src="experiments.js"></script>
<script type="text/javascript" src="handler.js"></script>
<script type="text/javascript" nonce="firebase-auth-helper">
var POST_BODY = '{{POST_BODY}}';
fireauth.oauthhelper.widget.initialize();
</script>
<script type="text/javascript">
// Tambahan LesLesanKu (bukan bagian dari file resmi Firebase):
// kalau halaman login ini dibuka di tab/jendela yang bukan asal login
// (mis. tab login lama yang dibuka lagi, atau HP memuat ulang tab itu),
// Firebase menampilkan error bahasa Inggris "missing initial state".
// Ganti dengan pesan ramah & kembalikan otomatis ke aplikasi.
(function(){
  var done=false;
  function friendly(){
    if(done) return;
    var el=document.getElementById('error-screen');
    if(!el||!/initial state/i.test(el.textContent||'')) return;
    done=true;
    // Jendela popup login → cukup tutup; aplikasi asal tetap terbuka
    try{ if(window.opener&&!window.opener.closed){ window.close(); } }catch(e){}
    document.title='LesLesanKu';
    document.body.innerHTML='<div style="font-family:-apple-system,Segoe UI,Roboto,sans-serif;max-width:420px;margin:18vh auto 0;padding:24px;text-align:center;color:#2b2420">'
      +'<div style="font-size:2.4rem">🔐</div>'
      +'<h2 style="margin:10px 0 8px;font-size:1.25rem">Halaman login sudah kedaluwarsa</h2>'
      +'<p style="margin:0 0 20px;line-height:1.55;color:#6b5f55">Halaman ini dari proses login sebelumnya. Data kamu aman. Kamu akan dibawa kembali ke LesLesanKu — kalau belum masuk, ketuk <b>Login dengan Google</b> sekali lagi.</p>'
      +'<a href="/" style="display:inline-block;background:#a8372a;color:#fff;text-decoration:none;font-weight:700;padding:13px 22px;border-radius:12px">Buka LesLesanKu</a>'
      +'</div>';
    setTimeout(function(){ location.replace('/'); }, 3500);
  }
  if(window.MutationObserver){
    new MutationObserver(friendly).observe(document.documentElement,{childList:true,subtree:true});
  }
  document.addEventListener('DOMContentLoaded',friendly);
  setTimeout(friendly,1500);
})();
</script>
</head>
<body>
</body>
</html>
